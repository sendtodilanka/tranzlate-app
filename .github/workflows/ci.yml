name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # C-3 says STRINGS_*.md is the only string-key authority, and until #152 nothing
      # checked it: PR-6 shipped `cd_lang_back` into three locales and no catalogue with
      # every gate green. `check` already depends on this task, so `./gradlew build` below
      # would catch it too — it runs first and by name so the failure is legible in one
      # minute instead of twenty, and so a future change to `build` cannot silently drop it.
      - name: "Guard: every shipped string key is in a STRINGS_*.md catalogue (C-3, #152)"
        run: ./gradlew verifyStringKeyDocs

      - name: Build (all variants, unit tests, lint)
        run: ./gradlew build

      - name: Unit tests incl. golden-table + Konsist gates
        run: ./gradlew test :app:testTranzlateProdDebugUnitTest

      # `./gradlew build` does NOT assemble androidTest sources, so the
      # instrumentation suite can be broken on main indefinitely with every run
      # green. It was: a missing PurchaseFlow binding (#111) sat there from
      # fabb214 until PR-10 needed that source set for a device probe and
      # tripped over it. Compiling is the cheap half of the gate and catches the
      # whole class — a retired signature, a fake that no longer implements its
      # interface, a binding removed from a module it was still wired into.
      #
      # Compile, not run: running is blocked by #40 (Espresso onIdle ->
      # InputManager.getInstance on API 35+), which is a separate fix and needs
      # a device this workflow does not have.
      #
      # `assembleAndroidTest` rather than a named variant: only tranzlateProd
      # has an androidTest variant today, and naming it would make this gate
      # silently skip a flavour that gains one later — the same shape of miss
      # this gate exists to catch.
      - name: "Guard: instrumentation sources still compile (#148)"
        run: ./gradlew :app:assembleAndroidTest

      # ---- plan §6.6 guards ------------------------------------------------------

      - name: "Guard: prod/release runtime classpath excludes fake/test modules"
        run: |
          set -euo pipefail
          LEAKS=$(./gradlew -q :app:dependencies --configuration tranzlateProdReleaseRuntimeClasspath | grep -E "core:testing|translate-fake" || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::fake/test module leaked into the prod release runtime classpath:"; echo "$LEAKS"; exit 1
          fi

      - name: "Guard: fake runtime classpath excludes real brains and :lib:* AARs"
        run: |
          set -euo pipefail
          # Gradle prints project deps QUOTED (project ':core:translate') — pattern must
          # tolerate both quoted and unquoted forms or the guard is vacuous (co-verify finding #1).
          LEAKS=$(./gradlew -q :app:dependencies --configuration tranzlateFakeDebugRuntimeClasspath | grep -E "project '?:core:(translate|access|usage|ads)'?( |$)|project '?:lib:" | grep -v "translate-fake" || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::real brain/:lib:* module leaked into the fake runtime classpath:"; echo "$LEAKS"; exit 1
          fi

      - name: "Guard: no fakeRelease variant, no Play-publish task outside Prod"
        run: |
          set -euo pipefail
          TASKS=$(./gradlew -q :app:tasks --all)
          if echo "$TASKS" | grep -iE "(assemble|bundle|install).*fakeRelease"; then
            echo "::error::fakeRelease variant tasks exist (beforeVariants guard broken)"; exit 1
          fi
          if echo "$TASKS" | grep -iE "publish.*(Apk|Bundle|Release)" | grep -ivE "prod"; then
            echo "::error::Play-publish task exists outside Prod variants"; exit 1
          fi

      - name: Detekt + Spotless
        run: ./gradlew detekt spotlessCheck
