kotlin = "2.4.10"
ksp = "2.3.10"
composeBom = "2026.06.01"
material3Adaptive = "1.2.0"
hilt = "2.60.1"
androidxHilt = "1.4.0"
room = "2.8.4"
datastore = "1.2.1"
work = "2.11.2"
lifecycle = "2.11.0"
activity = "1.13.0"
coreSplashscreen = "1.0.1"
navigation3 = "1.1.4"
coroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
mlkitTranslate = "17.0.3"
mlkitLanguageId = "17.0.6"
okhttp = "4.12.0"
# Monetization (launch batch) — versions verified 2026-07-31 against Google Maven
# (google-services, firebase-bom) and Maven Central (qonversion) metadata.
firebaseBom = "34.17.0"
googleServices = "4.5.0"
qonversion = "9.7.0"
desugarJdkLibs = "2.1.5"
coreKtx = "1.19.0"
junit = "4.13.2"
turbine = "1.2.1"
truth = "1.4.5"
konsist = "0.17.3"
androidxTestRunner = "1.7.0"
composeMaterialIcons = "1.7.8" # icons line ended at 1.7.8 (no longer in the BOM); stable resource artifact
androidxTestExtJunit = "1.3.0"
javaxInject = "1"
detekt = "1.23.8"
spotless = "8.8.0"
# Debug-only leak watcher. 2.14 is the newest STABLE line — 3.0 has only ever
# published alphas (verified 2026-08-02 against Maven Central's
# com/squareup/leakcanary/leakcanary-android/maven-metadata.xml: 2.14 then
# 3.0-alpha-1..9). A tool that watches for leaks is not a place to run an alpha.
leakcanary = "2.14"
# Compose unit-test runtime (#186). 4.16.1 is the newest STABLE line: Maven
# Central's org/robolectric/robolectric/maven-metadata.xml reports
# <latest>/<release> = 4.17-beta-2, and the whole 4.17 line is betas — the same
# judgement recorded for leakcanary above. Verified 2026-08-02.
robolectric = "4.16.1"
# Robolectric's Android runtime image, pinned as a REAL Gradle dependency rather
# than left to the download Robolectric does out-of-band at test time.
#
# Two reasons, both about CI rather than taste. (1) The jar is 213,431,622 bytes
# (Maven Central content-length, verified 2026-08-02); fetched by Robolectric it
# lands in a cache `gradle/actions/setup-gradle` does not save, so every CI run
# pays for it again. Declared here it lands in `modules-2`, which that action
# already restores. (2) A dependency resolved outside Gradle is a dependency CI
# can fail to get while a warm developer machine sails through — the shape of
# #163, where local green was not evidence. `robolectric.offline=true` (wired in
# `tranzlate.compose-test`) removes the fallback, so a broken pin fails loudly
# instead of quietly downloading its way out of trouble.
#
# The value is NOT free-form: `DefaultSdkProvider` inside robolectric-4.16.1.jar
# maps API 36 — this repo's targetSdk, and the level Robolectric picks from the
# merged manifest — to exactly build id 13921718 (read with `javap -c`; the map
# tops out at 36, so 4.16.1 is also the floor for running here at all).
robolectricAndroidAll = "16-robolectric-13921718-i7"
# Roborazzi — JVM screenshot-diff harness layered on the Robolectric compose-test
# runtime above (#333). 1.70.0 is the newest STABLE line (Maven Central
# io/github/takahirom/roborazzi/roborazzi/maven-metadata.xml <release>=1.70.0,
# verified 2026-08-06; no -alpha/-beta/-rc suffix), the same "newest stable" rule
# robolectric and leakcanary follow above. Two hard requirements this repo forces,
# each met by a change read from Roborazzi's OWN release notes (not assumed):
#   - AGP 9 support: this repo is agp = 9.3.0, and Roborazzi migrated off the
#     deprecated Variant.unitTest / TestedExtension onto the supported variant API
#     in 1.70.0's line at 1.56.0 (PR #782, "Add AGP 9.0 compatibility"). A pin
#     before 1.56.0 would not configure on AGP 9 at all.
#   - Configuration cache: gradle.properties sets org.gradle.configuration-cache=true;
#     Roborazzi's config-cache integrity check landed in 1.60.0, on top of the
#     earlier resolvedConfiguration-API fix (PR #759). 1.70.0 carries both, and its
#     verify wiring resolves its run-mode through Provider chains + taskGraph
#     (CC-safe), which the self-test exercises end to end under CC.
# Robolectric Native Graphics — the pixel renderer captureRoboImage() needs — has
# shipped since Robolectric 4.10; this repo pins 4.16.1, so RNG is available and the
# screenshot test opts in with @GraphicsMode(NATIVE).
roborazzi = "1.70.0"

