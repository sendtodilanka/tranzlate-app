# MLKit (catalog-pin only — phase 2)
mlkit-translate = { group = "com.google.mlkit", name = "translate", version.ref = "mlkitTranslate" }
mlkit-language-id = { group = "com.google.mlkit", name = "language-id", version.ref = "mlkitLanguageId" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# Firebase — the BOM pins module versions; ONLY firebase-config is consumed.
# firebase-analytics is deliberately absent: Google's docs require it for
# CONDITIONAL targeting (audiences / user properties / A-B), not for
# fetch+activate, and it is an analytics-consent surface we have not designed.
# `-ktx` artifacts are gone from BOM 34.x — the KTX API lives in the main module.
google-firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
google-firebase-config = { group = "com.google.firebase", name = "firebase-config" }

# Billing provider. Pulls Play Billing 8.1.0 transitively through an `api` scope,
# so it must stay inside :lib:subscription and never leak into a feature module.
qonversion = { group = "io.qonversion.android.sdk", name = "sdk", version.ref = "qonversion" }

# Desugaring
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# Leak watcher — `debugImplementation` ONLY (see :app/build.gradle.kts).
leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
konsist = { group = "com.lemonappdev", name = "konsist", version.ref = "konsist" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
# Consumed ONLY through the `tranzlate.robolectric` convention plugin (#186, split
# out of `tranzlate.compose-test` by #231) — a module opts into the JVM Android
# unit-test runtime with one line and never copies a dependency block.
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
robolectric-android-all = { group = "org.robolectric", name = "android-all-instrumented", version.ref = "robolectricAndroidAll" }
# Roborazzi screenshot-diff (#333). Consumed ONLY through the `tranzlate.compose-test`
# convention plugin, which applies the Gradle plugin and puts these three on
# `testImplementation` — a compose-test module opts in with the one alias line it already
# has, never a copied dependency block (the same discipline robolectric above follows).
#  - `roborazzi` carries `SemanticsNodeInteraction.captureRoboImage()`, the form used with
#    `createComposeRule` (Roborazzi.kt); it pulls `roborazzi-core-*` transitively.
#  - `roborazzi-compose` the composable-content `captureRoboImage(path) { }` form.
#  - `roborazzi-junit-rule` the OPTIONAL `RoborazziRule`; carried so a future test that
#    wants capture-on-failure has it without a catalog change.
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }

# Gradle plugin artifacts (for build-logic classpath)
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
room-gradle-plugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "room" }
hilt-android-gradle-plugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }
# Roborazzi Gradle plugin on the build-logic classpath, so `ComposeTestConventionPlugin`
# can apply `io.github.takahirom.roborazzi` by id and configure its `roborazzi { }`
# extension — the same shape as room/hilt above (#333).
roborazzi-gradle-plugin = { group = "io.github.takahirom.roborazzi", name = "roborazzi-gradle-plugin", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
# Reads app/google-services.json into the Firebase config resources. Google Maven
# ONLY (Maven Central stopped at 3.1.1, 2017) — settings.gradle.kts already routes
# `com.google.*` to google(). Applies to :app alone: the plugin's own README and
# source restrict it to com.android.application / com.android.dynamic-feature, and
# on a library module it merely logs an error and generates nothing.
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }

# Screenshot-diff plugin (#333). NOT applied via a module `plugins {}` alias — it is
# applied inside `tranzlate.compose-test` (through the gradle-plugin artifact on the
# build-logic classpath) so every compose-test module gets it with no per-module edit.
# Declared here to keep the id + version in the one catalog the whole build reads.
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }

# Convention plugins (build-logic included build)
tranzlate-android-application = { id = "tranzlate.android.application" }
tranzlate-android-application-compose = { id = "tranzlate.android.application.compose" }
tranzlate-android-application-flavors = { id = "tranzlate.android.application.flavors" }
tranzlate-android-application-signing = { id = "tranzlate.android.application.signing" }
tranzlate-android-library = { id = "tranzlate.android.library" }
tranzlate-android-library-compose = { id = "tranzlate.android.library.compose" }
tranzlate-android-feature = { id = "tranzlate.android.feature" }
tranzlate-android-room = { id = "tranzlate.android.room" }
tranzlate-jvm-library = { id = "tranzlate.jvm.library" }
tranzlate-hilt = { id = "tranzlate.hilt" }
tranzlate-robolectric = { id = "tranzlate.robolectric" }
tranzlate-compose-test = { id = "tranzlate.compose-test" }
tranzlate-preflight = { id = "tranzlate.preflight" }
