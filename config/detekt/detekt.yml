# Tranzlate detekt overrides (buildUponDefaultConfig = true).
#
# Token discipline (DESIGN_SYSTEM §10 rule — "no raw hex, dp text sizes, or magic paddings
# in Composables; everything resolves through a token"):
#   - Raw hex colors (`Color(0xFF...)`) belong ONLY in :core:designsystem token files.
#   - Raw `dp`/`sp` literals belong ONLY in :core:designsystem (Spacing/Dimensions/Type tokens).
#   Detekt's rule set cannot express these type-resolved checks reliably without a
#   classpath-aware run, so the enforcement home is code review + the designsystem module
#   boundary (only :core:designsystem may define tokens); MagicNumber below is configured
#   to keep numeric literals out of feature/UI code as a proxy guard.

build:
  maxIssues: 0

style:
  MagicNumber:
    active: true
    # `testProd` is the unit-test source set of the prod FLAVOR (app/src/testProd),
    # the same kind of source as `test` — flavor-scoped test sources need their own
    # entry because these globs match path segments exactly.
    excludes:
      ['**/core/designsystem/**', '**/core/testing/**', '**/test/**', '**/testProd/**', '**/androidTest/**',
        '**/androidTestProd/**']
    ignoreAnnotated: ['Preview', 'PreviewLightDark']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreEnums: true
  UnusedPrivateMember:
    # Preview functions are entry points for Android Studio / screenshot tooling,
    # not dead code — the project convention REQUIRES a @PreviewLightDark per
    # public composable (.claude/memory compose-preview convention).
    ignoreAnnotated: ['Preview', 'PreviewLightDark']
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    active: false
  ThrowsCount:
    active: false

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
    # `testProd` — see the MagicNumber note above; backticked test names are the
    # house style and a flavor-scoped test source set is still a test source set.
    excludes: ['**/test/**', '**/testProd/**', '**/androidTest/**', '**/androidTestProd/**']
  TopLevelPropertyNaming:
    active: false

comments:
  active: false
